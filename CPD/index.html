<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e9eff3" />
  <title>Practice Ledger — CPD logging</title>
  <meta name="description" content="Private CPD planning, activity logging and reporting for signed-in R3 Psychology users." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="canonical" href="https://r3psychology.com/CPD/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="app-shell">
    <header class="nav glass">
      <a class="brand" href="#summary" aria-label="Practice Ledger home">Practice <i>Ledger</i></a>
      <nav id="nav" aria-label="CPD sections"></nav>
      <span class="spacer"></span>
      <a class="sync-chip" id="syncChip" href="#settings" hidden></a>
      <a class="avatar" id="avatar" href="#settings" title="Profile and settings" aria-label="Profile and settings"></a>
    </header>
    <div class="subbar">
      <label class="cycle-picker">
        <span class="mono">CPD cycle</span>
        <select id="cycleSelect" aria-label="CPD cycle"></select>
      </label>
      <span class="mono" id="cycleNote"></span>
      <span id="auth-slot"></span>
    </div>

    <main>
      <div id="app" class="content" tabindex="-1">
        <p class="loading">Loading your CPD record…</p>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="app.js"></script>
  <script src="../water.js" defer></script>
</body>
</html>
